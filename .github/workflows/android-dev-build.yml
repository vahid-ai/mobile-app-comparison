# Builds a development Android APK on EAS for every pull request into the
# `android` branch, and attaches the APK to a GitHub release.
#
#   gate    typecheck + the core parity tests. Cheap, and it runs first so a
#           broken commit never spends an EAS build (they are slow and the
#           free tier is metered).
#   build   `eas build --profile development --platform android`, waits for
#           it, downloads the APK, publishes it as a prerelease tagged
#           `android-dev-pr<N>-<run>`, and comments the link on the PR.
#
# Installing that APK once turns the phone into a target for every
# `eas update` the preview workflow publishes — see
# react-native-cloudflare/README.md, "Getting it onto a phone".

name: Android dev build

on:
  pull_request:
    branches: [android]
  workflow_dispatch:

concurrency:
  group: android-dev-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: react-native-cloudflare

jobs:
  gate:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native-cloudflare/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core parity tests
        run: npm test

      # `developmentClient: true` requires expo-dev-client to be a dependency;
      # without it `eas build` bails after setup, which is a slow way to learn
      # about a one-line problem.
      - name: Check the development profile's dependencies
        run: |
          node -e "
            const fs = require('fs');
            const eas = JSON.parse(
              fs.readFileSync('eas.json', 'utf8').replace(/^\s*\/\/.*\$/gm, ''),
            );
            const pkg = require('./package.json');
            const profile = eas.build?.development ?? {};
            if (profile.developmentClient && !pkg.dependencies?.['expo-dev-client']) {
              console.error(
                'eas.json sets developmentClient: true but expo-dev-client is not a dependency.\n' +
                'Run: npx expo install expo-dev-client',
              );
              process.exit(1);
            }
            console.log('development profile OK');
          "

  build:
    name: EAS build and release
    needs: gate
    runs-on: ubuntu-latest
    # The free EAS tier queued a build past 90 minutes on the first run, so
    # this is set near GitHub's 6-hour ceiling. Actions minutes are free on
    # public repositories, and the build URL is commented on the pull request
    # long before this bound matters.
    timeout-minutes: 350
    # Secrets are not exposed to pull requests from forks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Creating the release and its tag.
      contents: write
      # Commenting the download link on the pull request.
      pull-requests: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: preflight
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::notice title=EXPO_TOKEN not set::Skipping the Android build."
            {
              echo "### Build skipped — no \`EXPO_TOKEN\`"
              echo
              echo "Add a token from <https://expo.dev/settings/access-tokens>"
              echo "as a repository secret named \`EXPO_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native-cloudflare/package-lock.json

      - name: Install
        if: steps.preflight.outputs.ready == 'true'
        run: npm ci

      - uses: expo/expo-github-action@v8
        if: steps.preflight.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Submitting and waiting are deliberately separate steps.
      #
      # `eas build --wait` holds the runner for the whole queue, and on the
      # free tier that queue ran past 90 minutes with nothing reported — the
      # job was killed and the finished build was never collected. Submitting
      # with `--no-wait` gets the build URL onto the pull request within a
      # couple of minutes, so the link survives even if the wait later gives
      # up.
      #
      # If a build for this exact commit is already in flight (a re-run, or a
      # retried job), attach to it rather than paying for another one.
      - name: Submit the build to EAS
        id: submit
        if: steps.preflight.outputs.ready == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail

          eas build:list \
            --platform android \
            --limit 30 \
            --non-interactive \
            --json > existing.json 2>/dev/null || echo '[]' > existing.json

          existing=$(node -e "
            const list = JSON.parse(require('fs').readFileSync('existing.json', 'utf8'));
            const live = new Set(['NEW', 'IN_QUEUE', 'IN_PROGRESS']);
            const match = (Array.isArray(list) ? list : []).find(
              (b) => b?.gitCommitHash === process.env.HEAD_SHA && live.has(b?.status),
            );
            console.log(match ? match.id : '');
          ")

          if [ -n "$existing" ]; then
            echo "Reusing in-flight build ${existing} for ${HEAD_SHA}"
            id="$existing"
          else
            eas build \
              --platform android \
              --profile development \
              --non-interactive \
              --no-wait \
              --json > submit.json
            cat submit.json
            id=$(node -e "
              const out = JSON.parse(require('fs').readFileSync('submit.json', 'utf8'));
              const build = Array.isArray(out) ? out[0] : out;
              if (!build?.id) { console.error('no build id in submit output'); process.exit(1); }
              console.log(build.id);
            ")
          fi

          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "url=https://expo.dev/builds/${id}" >> "$GITHUB_OUTPUT"

      # Posted before the wait, so the link exists no matter how long the
      # queue is or whether this job survives it.
      - name: Comment that the build is queued
        if: steps.preflight.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_URL: ${{ steps.submit.outputs.url }}
        run: |
          {
            printf '⏳ **Android dev build queued** — [watch it on EAS](%s).\n\n' "$BUILD_URL"
            printf 'The APK will be attached to a prerelease here when it finishes.\n'
          } > queued.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file queued.md

      # Polls instead of `--wait` so progress is visible in the log; the job's
      # timeout is the real bound.
      - name: Wait for the build to finish
        if: steps.preflight.outputs.ready == 'true'
        env:
          BUILD_ID: ${{ steps.submit.outputs.id }}
        run: |
          for attempt in $(seq 1 330); do
            eas build:view "$BUILD_ID" --json > build.json 2>/dev/null || true
            status=$(node -e "
              try {
                const b = JSON.parse(require('fs').readFileSync('build.json', 'utf8'));
                console.log((Array.isArray(b) ? b[0] : b)?.status ?? 'UNKNOWN');
              } catch { console.log('UNKNOWN'); }
            ")
            echo "[${attempt}] ${BUILD_ID} -> ${status}"
            case "$status" in
              FINISHED)
                exit 0
                ;;
              ERRORED|CANCELED)
                echo "::error title=EAS build ${status}::See https://expo.dev/builds/${BUILD_ID}"
                exit 1
                ;;
            esac
            sleep 60
          done
          echo "::error title=Timed out::Build still unfinished; see https://expo.dev/builds/${BUILD_ID}"
          exit 1

      - name: Download the APK
        id: apk
        if: steps.preflight.outputs.ready == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
        run: |
          # The archive key has been renamed across CLI versions, so accept
          # either spelling.
          url=$(node -e "
            const builds = JSON.parse(require('fs').readFileSync('build.json', 'utf8'));
            const build = Array.isArray(builds) ? builds[0] : builds;
            const a = build?.artifacts ?? {};
            const url = a.applicationArchiveUrl ?? a.buildUrl ?? build?.artifacts?.apkUrl;
            if (!url) {
              console.error('no artifact URL in build.json');
              process.exit(1);
            }
            console.log(url);
          ")
          name="pulse-events-dev-pr${PR_NUMBER}.apk"
          echo "Downloading ${url}"
          curl -fsSL "$url" -o "$name"
          ls -lh "$name"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=react-native-cloudflare/${name}" >> "$GITHUB_OUTPUT"

      # `gh` is preinstalled on GitHub runners. The tag carries the run number
      # so a re-run of the same PR does not collide with an existing release.
      - name: Publish the release
        id: release
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          tag="android-dev-pr${PR_NUMBER}-${GITHUB_RUN_NUMBER}"

          # A notes file rather than an inline string: the YAML block scalar
          # would otherwise bake its own indentation into the release body.
          {
            printf 'Development build (`developmentClient: true`, internal distribution) of `%s`.\n\n' "$TARGET_SHA"
            printf 'Install the APK on a device or emulator; every `eas update` published for this project then arrives in it over the air.\n'
          } > notes.md

          gh release create "$tag" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Android dev build — PR #${PR_NUMBER}" \
            --prerelease \
            --notes-file notes.md
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Android dev build"
            echo
            echo "- APK: \`${APK}\`"
            echo "- Release: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the download link
        if: steps.preflight.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          {
            printf '🤖 **Android dev build ready**\n\n'
            printf '`%s` is attached to [%s](%s).\n\n' "$APK" "${RELEASE_URL##*/}" "$RELEASE_URL"
            printf 'Install it on a device or emulator; every `eas update` for this project then arrives over the air.\n'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
